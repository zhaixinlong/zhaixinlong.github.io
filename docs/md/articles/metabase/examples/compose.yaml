version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: metabase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: "${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - metabase-net

  metabase:
    image: metabase/metabase:v0.56.4
    container_name: metabase
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "13000:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: "5432"
      MB_DB_USER: metabase
      MB_DB_PASS: "${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env}"
      MB_DB_HOST: postgres
      MB_JETTY_PORT: "3000"
      JAVA_TIMEZONE: Asia/Shanghai
      JAVA_OPTS: "-Xms1g -Xmx1500m"
    volumes:
      - metabase_plugins:/plugins
    networks:
      - metabase-net

networks:
  metabase-net:
    driver: bridge

volumes:
  postgres_data:
  metabase_plugins:
